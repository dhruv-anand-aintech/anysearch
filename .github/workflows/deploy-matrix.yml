name: Deploy search provider matrix

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/deploy-matrix.yml"
      - "docs/tools/search_matrix/**"
      - "scripts/generate_matrix_changelog.py"
      - "scripts/generate_search_matrix_data.py"
      - "scripts/apply_search_research.py"
      - "scripts/check_search_research.py"
      - "scripts/tests/**"
      - "scripts/search_matrix_provider_meta.py"
      - "scripts/verify_matrix_page.mjs"
      - "scripts/matrix_import_hooks.mjs"
      - "python/src/anysearch/providers/**"
      - "worker/matrix.js"
      - "wrangler.toml"
      - "package.json"
      - "package-lock.json"
  schedule:
    - cron: "17 8 * * 1"
  workflow_dispatch:

jobs:
  deploy:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: python/pyproject.toml

      - run: npm ci --no-audit --no-fund

      # The generator adds python/src to sys.path itself, so no editable install is needed.
      - name: Install matrix runtime dependency
        run: python3 -m pip install --disable-pip-version-check httpx

      - name: Sync matrix data
        run: npm run matrix:sync

      - name: Verify matrix
        run: |
          npm run matrix:research-check
          npm run matrix:test
          git diff --exit-code -- docs/tools/search_matrix/changelog.json

      - name: Deploy to Cloudflare Workers
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "Skipping deploy: add CLOUDFLARE_API_TOKEN to repo Actions secrets (see docs/tools/search_matrix/README.md)."
            exit 0
          fi
          node node_modules/wrangler/bin/wrangler.js deploy --config wrangler.toml

  audit:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: python/pyproject.toml

      - run: npm ci --no-audit --no-fund
      - run: python3 -m pip install --disable-pip-version-check httpx

      - name: Sync matrix data and verify
        run: |
          npm run matrix:sync
          npm run matrix:research-check
          npm run matrix:test
          git diff --exit-code -- docs/tools/search_matrix/changelog.json

      - name: Check official public source availability
        run: python3 scripts/check_search_research.py --check-links

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: official-source-availability
          path: source-check-report.json
